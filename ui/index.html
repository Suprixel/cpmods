<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberpunk Mods</title>
<script>window.CP_TOKEN = "__CP_TOKEN__"; window.CP_PREFS = __CP_PREFS__;</script>
<script>try { var p = window.CP_PREFS || JSON.parse(localStorage.getItem('cpmods.beta') || '{}'), r = document.documentElement, f = p.perf || {}; if (p.theme && p.theme !== 'yellow') r.setAttribute('data-theme', p.theme); if (p.bg && p.bg !== 'match') r.setAttribute('data-bg', p.bg); if (p.themeVars) for (var k in p.themeVars) r.style.setProperty(k, p.themeVars[k]); if (f.fx === false) r.classList.add('nofx'); if (f.pics === 'off') r.classList.add('pics-off'); } catch (e) {} if (/\bcpmods-frame\b/.test(navigator.userAgent)) document.documentElement.classList.add('framed');</script>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="tb" id="tb"></header>
<div class="app">
  <aside class="side">
    <div class="brand-row"><div class="brand"><span class="logo" aria-hidden="true"></span><span class="wordmark">cp<span class="acc">mods</span></span></div><div class="hist" id="hist"></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <section class="main">
    <div id="banner"></div>
    <div class="workspace">
      <div class="page" id="page"></div>
      <aside class="pane" id="paneBox" hidden aria-label="Details">
        <div class="pane-grip" id="paneGrip" title="Drag to resize, double-click to reset"></div>
        <div class="pane-strip" id="paneStrip" hidden></div>
        <div class="pane-scroll" id="pane"></div>
      </aside>
    </div>
    <div class="activity" id="activity" hidden></div>
  </section>
</div>
<div class="scrim" id="scrim" hidden data-act="pane-close"></div>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="lightbox" id="lightbox" hidden></div>
<div class="modal" id="modal" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
